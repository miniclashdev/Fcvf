<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype — jeu de cartes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --fond:#15122A; --panneau:#201B3C; --panneau2:#2A2450; --bord:#3B3466;
  --texte:#EDE9FF; --texte2:#A29BC9; --or:#E0B44C;
  --sang:#C4453F; --bouclier:#5B8FD6; --vie:#58B368; --energie:#5FD6C4;
  --commun:#8B86A8; --rare:#4E8FD1; --epique:#A05FD6; --legendaire:#E0B44C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--fond);color:var(--texte);
  font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;padding-bottom:78px}
h1,h2,h3{font-family:"Bricolage Grotesque",Inter,sans-serif;font-weight:700;margin:0;letter-spacing:-.015em}
button{font-family:inherit;font-size:15px;color:inherit;cursor:pointer;border:none;background:none}

.top{position:sticky;top:0;z-index:20;background:var(--fond);border-bottom:1px solid var(--bord);
  padding:9px 14px;display:flex;align-items:center;gap:12px}
.top h1{font-size:16px;flex:1}
.res{display:flex;align-items:center;gap:4px;font-weight:600;font-size:14px}
.res b{color:var(--or);font-weight:600}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
  background:var(--panneau);border-top:1px solid var(--bord)}
.nav button{flex:1;padding:12px 2px 17px;color:var(--texte2);font-size:11.5px;font-weight:500}
.nav button.on{color:var(--or);box-shadow:inset 0 2px 0 var(--or)}

main{padding:13px}
.vue{display:none}
.vue.on{display:block}
.bloc{background:var(--panneau);border:1px solid var(--bord);border-radius:14px;padding:14px;margin-bottom:13px}
.bloc h2{font-size:16px;margin-bottom:3px}
.sous{color:var(--texte2);font-size:13px}
.btn{background:var(--or);color:#241B02;font-weight:600;border-radius:10px;padding:12px 16px;width:100%;margin-top:11px;
  transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.second{background:var(--panneau2);color:var(--texte);border:1px solid var(--bord)}

/* ───────── BOOSTERS ───────── */
.des{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:58px;align-items:center;margin:14px 0}
.de{width:50px;height:50px;border-radius:13px;background:var(--panneau2);border:1px solid var(--bord);
  display:flex;align-items:center;justify-content:center;
  font-family:"Bricolage Grotesque",sans-serif;font-size:25px;font-weight:700}
.de.serie{border-color:var(--or);color:var(--or);background:#332A10}
.de.roule{animation:roule .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes roule{
  0%{transform:rotate(-180deg) scale(.2);opacity:0}
  55%{transform:rotate(25deg) scale(1.22);opacity:1}
  100%{transform:rotate(0) scale(1)}
}
.score{text-align:center;font-family:"Bricolage Grotesque",sans-serif}
.score .n{font-size:36px;font-weight:700;color:var(--or);line-height:1;animation:pop .35s}
.score .l{font-size:13px;color:var(--texte2);font-family:Inter,sans-serif}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.annonce{background:#332A10;border:1px solid var(--or);color:var(--or);border-radius:10px;
  padding:9px 12px;font-size:13px;font-weight:500;margin-top:10px;text-align:center;animation:pop .3s}

.paquet{width:120px;height:168px;margin:6px auto 0;border-radius:14px;
  background:linear-gradient(150deg,#3A2E6B,#241B48);border:1px solid var(--or);
  display:flex;align-items:center;justify-content:center;font-size:44px;
  box-shadow:0 0 0 4px rgba(224,180,76,.09)}
.paquet.secoue{animation:secoue .5s}
.paquet.eclate{animation:eclate .45s forwards}
@keyframes secoue{
  0%,100%{transform:translateX(0) rotate(0)}
  20%{transform:translateX(-7px) rotate(-4deg)}
  40%{transform:translateX(7px) rotate(4deg)}
  60%{transform:translateX(-5px) rotate(-3deg)}
  80%{transform:translateX(5px) rotate(3deg)}
}
@keyframes eclate{to{transform:scale(1.5);opacity:0}}

.revele{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px;perspective:900px}
.flip{position:relative;aspect-ratio:.72;transform-style:preserve-3d;transform:rotateY(180deg);
  transition:transform .55s cubic-bezier(.4,1.2,.5,1)}
.flip.ouvert{transform:rotateY(0)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;overflow:hidden;
  border:1px solid var(--bord);background:var(--panneau2);display:flex;flex-direction:column}
.dos{transform:rotateY(180deg);background:linear-gradient(150deg,#3A2E6B,#241B48);
  align-items:center;justify-content:center;font-size:30px;border-color:var(--or)}
.face .vis{flex:1;display:flex;align-items:center;justify-content:center;font-size:32px;border-bottom:1px solid var(--bord)}
.face .vis img{width:100%;height:100%;object-fit:cover}
.face .nom{font-size:10.5px;font-weight:600;padding:5px 6px 2px;line-height:1.22}
.face .st{font-size:9.5px;color:var(--texte2);padding:0 6px 6px}
.face .frag{font-size:9.5px;color:var(--or);padding:0 6px 6px}
.eclat{box-shadow:0 0 14px 1px currentColor}

/* ───────── CARTES ───────── */
.grille{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.carte{background:var(--panneau2);border:1px solid var(--bord);border-radius:10px;overflow:hidden;
  text-align:left;display:block;width:100%}
.carte .vis{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:30px;border-bottom:1px solid var(--bord)}
.carte .vis img{width:100%;height:100%;object-fit:cover}
.carte .nom{font-size:11px;font-weight:600;padding:5px 6px 2px;line-height:1.24}
.carte .st{font-size:10px;color:var(--texte2);padding:0 6px 6px}
.carte.vide{opacity:.34}
.barref{height:3px;background:var(--bord);border-radius:2px;margin:0 6px 6px}
.barref i{display:block;height:100%;background:var(--or);border-radius:2px}
.r-commun{border-color:var(--commun);color:var(--commun)}
.r-rare{border-color:var(--rare);color:var(--rare)}
.r-epique{border-color:var(--epique);color:var(--epique)}
.r-legendaire{border-color:var(--legendaire);color:var(--legendaire)}

/* ───────── TERRAIN ───────── */
.terrain{display:flex;flex-direction:column;gap:7px}
.rangee{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.cotes{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.slot{position:relative;background:var(--panneau2);border:1px dashed var(--bord);border-radius:10px;
  min-height:76px;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;font-size:10.5px;color:var(--texte2);transition:transform .15s,border-color .15s}
.slot.rempli{border-style:solid;background:var(--panneau);color:var(--texte)}
.slot.libre{border-color:var(--energie);background:#16302E;color:var(--energie)}
.slot.cible{border-color:var(--sang);background:#33161A;animation:palpite 1s infinite}
.slot.actif{border-color:var(--or);box-shadow:0 0 0 2px rgba(224,180,76,.3)}
.slot.epuise{opacity:.5}
.slot.mort{opacity:.28}
@keyframes palpite{0%,100%{box-shadow:0 0 0 0 rgba(196,69,63,.5)}50%{box-shadow:0 0 0 5px rgba(196,69,63,0)}}
.slot .sv{font-size:21px;line-height:1}
.slot .sn{font-size:10.5px;font-weight:600;line-height:1.2;margin-top:1px}
.jauge{width:100%;height:4px;background:#0D0B1A;border-radius:2px;margin-top:3px;overflow:hidden}
.jauge i{display:block;height:100%;transition:width .35s}
.jauge.pv i{background:var(--vie)}
.jauge.def i{background:var(--bouclier)}
.etiq{font-size:9px;color:var(--sang);font-weight:600;margin-top:1px}
.slot.frappe{animation:frappe .4s}
@keyframes frappe{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}45%{transform:translateX(6px)}
  70%{transform:translateX(-4px)}90%{transform:translateX(3px)}
}
.slot.bond{animation:bond .4s}
@keyframes bond{0%,100%{transform:translateY(0)}45%{transform:translateY(-11px) scale(1.06)}}
.nombre{position:absolute;top:2px;left:0;right:0;font-family:"Bricolage Grotesque",sans-serif;
  font-size:20px;font-weight:700;pointer-events:none;animation:flotte 1s forwards;z-index:5}
@keyframes flotte{
  0%{transform:translateY(6px) scale(.7);opacity:0}
  25%{transform:translateY(-4px) scale(1.1);opacity:1}
  100%{transform:translateY(-26px);opacity:0}
}
.score-l{display:flex;justify-content:space-between;align-items:center;font-size:12px;
  color:var(--texte2);font-weight:500;margin:0 0 7px}
.score-l .pts{font-family:"Bricolage Grotesque",sans-serif;font-size:16px;font-weight:700;color:var(--or)}
.camp{font-size:12px;color:var(--texte2);text-align:center;font-weight:500;margin:0 0 6px}
.sep{height:1px;background:var(--bord);margin:11px 0}

/* ───────── ÉNERGIE + MAIN ───────── */
.barreE{display:flex;align-items:center;gap:9px;margin:10px 0 4px}
.pastilles{display:flex;gap:3px;flex-wrap:wrap;flex:1}
.pas{width:13px;height:13px;border-radius:50%;background:#0D0B1A;border:1px solid var(--bord)}
.pas.plein{background:var(--energie);border-color:var(--energie)}
.pas.neuf{animation:pop .4s}
.eTexte{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;color:var(--energie)}

.main{display:flex;gap:7px;overflow-x:auto;padding:9px 0 3px;scrollbar-width:none}
.main::-webkit-scrollbar{display:none}
.mc{flex:0 0 82px;background:var(--panneau2);border:1px solid var(--bord);border-radius:10px;
  padding:6px;text-align:center;transition:transform .15s;animation:pioche .4s}
@keyframes pioche{from{transform:translateY(14px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.mc.jouable{border-color:var(--energie)}
.mc.select{border-color:var(--or);transform:translateY(-7px)}
.mc:disabled{opacity:.4}
.mc .mv{font-size:23px;line-height:1.15}
.mc .mn{font-size:10px;font-weight:600;line-height:1.2;margin-top:2px}
.mc .mcout{font-size:10px;color:var(--energie);font-weight:600;margin-top:2px}

.journal{background:#0D0B1A;border:1px solid var(--bord);border-radius:10px;padding:9px;
  height:112px;overflow-y:auto;font-size:12.5px;line-height:1.55;margin-top:11px}
.journal p{margin:0 0 2px;animation:pop .25s}
.journal .imp{color:var(--or)}
.journal .mal{color:var(--sang)}

/* ───────── PANNEAUX ───────── */
.fond{position:fixed;inset:0;background:rgba(8,6,18,.84);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.fiche{background:var(--panneau);border-top:1px solid var(--bord);border-radius:16px 16px 0 0;
  padding:17px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;animation:monte .28s}
@keyframes monte{from{transform:translateY(60px)}to{transform:none}}
.fiche .tete{display:flex;gap:12px;align-items:center;margin-bottom:11px}
.fiche .av{width:58px;height:58px;border-radius:10px;background:var(--panneau2);border:1px solid var(--bord);
  display:flex;align-items:center;justify-content:center;font-size:29px;flex:0 0 auto;overflow:hidden}
.fiche .av img{width:100%;height:100%;object-fit:cover}
.fiche h3{font-size:18px}
.rar{font-size:12px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:11px 0}
.stat{background:var(--panneau2);border-radius:8px;padding:7px 10px}
.stat .k{font-size:11px;color:var(--texte2)}
.stat .v{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:700}
.atk{width:100%;text-align:left;background:var(--panneau2);border:1px solid var(--bord);
  border-radius:10px;padding:10px;margin-bottom:7px}
.atk .l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.atk .an{font-size:14px;font-weight:600}
.atk .ac{font-size:12px;font-weight:600;color:var(--energie);flex:0 0 auto}
.atk .ad{font-size:11.5px;color:var(--texte2);margin-top:2px}
.atk:disabled{opacity:.36}
.liste{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.item{display:flex;gap:10px;align-items:center;background:var(--panneau2);border:1px solid var(--bord);
  border-radius:10px;padding:8px;width:100%;text-align:left}
.item .av{width:37px;height:37px;border-radius:7px;background:var(--panneau);display:flex;
  align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.item .t{font-size:13px;font-weight:600}
.item .d{font-size:11px;color:var(--texte2)}
.vide-msg{color:var(--texte2);font-size:13px;text-align:center;padding:16px 0}
.astuce{background:#16302E;border:1px solid var(--energie);color:var(--energie);border-radius:9px;
  padding:8px 11px;font-size:12.5px;margin-top:9px;text-align:center}

.aff{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.aff span{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  background:var(--panneau2);border:1px solid var(--bord);border-radius:20px;padding:2px 8px;color:var(--texte2)}
.secret{background:#2A1836;border:1px solid var(--epique);border-radius:10px;padding:10px;margin-top:8px}
.secret b{display:block;font-size:10.5px;color:var(--epique);letter-spacing:.06em;
  text-transform:uppercase;font-weight:600;margin-bottom:3px}
.secret .v{font-size:13px}
.combo{background:#16302E;border:1px solid var(--energie);border-radius:10px;padding:10px;margin-top:8px}
.combo b{display:block;font-size:10.5px;color:var(--energie);letter-spacing:.06em;
  text-transform:uppercase;font-weight:600;margin-bottom:3px}
.combo .cn{font-size:14px;font-weight:600}
.combo .cd{font-size:12.5px;color:var(--texte2);margin-top:2px}
.combo.verrou{background:var(--panneau2);border-color:var(--bord);border-style:dashed}
.combo.verrou b{color:var(--texte2)}
.entree{display:flex;gap:11px;align-items:center;background:var(--panneau2);border:1px solid var(--bord);
  border-radius:11px;padding:9px;width:100%;text-align:left;margin-bottom:8px}
.entree .ev{width:52px;height:52px;border-radius:9px;overflow:hidden;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--panneau)}
.entree .ev img{width:100%;height:100%;object-fit:cover}
.entree .en{font-size:14px;font-weight:600;line-height:1.2}
.entree .ee{font-size:11px;color:var(--texte2);margin-top:2px}
.lore{font-size:13px;font-style:italic;color:var(--texte2);margin-top:9px;line-height:1.55;
  border-left:2px solid var(--bord);padding-left:10px}
.combo-actif{background:#16302E;border:1px solid var(--energie);color:var(--energie);
  border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:600;margin-bottom:6px;text-align:center}



/* SVG dessines */
.tcg-art svg,.carte .vis svg,.mc .mv svg,.slot .sv svg,.entree .ev svg,.fiche .av svg{
  width:100%;height:100%;display:block}
.carte .vis,.entree .ev,.fiche .av{overflow:hidden}

/* Schema et regles du codex */
.schema{background:var(--panneau2);border:1px solid var(--bord);border-radius:11px;padding:11px;margin-top:10px}
.sch-lig{display:grid;grid-template-columns:38px 1fr 38px;gap:5px;margin-bottom:5px}
.sch-c{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.sch-s,.sch-f{border-radius:7px;padding:9px 2px;text-align:center;font-size:8.5px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--bord)}
.sch-f{background:#231D46;color:var(--texte2);display:flex;align-items:center;justify-content:center}
.sch-f.sch-vide{opacity:0;border:0}
.sch-s.av{background:#2A2450;color:var(--texte)}
.sch-s.vd{background:transparent;border-style:dashed;color:var(--texte2)}
.sch-s.cv{background:#16304A;color:var(--bouclier);border-color:var(--bouclier)}
.sch-s.ex{background:#3A1620;color:var(--sang);border-color:var(--sang)}
.sch-leg{font-size:11.5px;color:var(--texte2);line-height:1.5;margin-top:8px}
.regle{background:var(--panneau2);border:1px solid var(--bord);border-left:3px solid var(--or);
  border-radius:9px;padding:10px;margin-top:9px;font-size:12.5px;line-height:1.5;color:var(--texte2)}
.regle b{display:block;color:var(--texte);font-size:13px;margin-bottom:3px}

/* ───────── TERRAIN : flancs + bloc central ───────── */
.champ{display:grid;grid-template-columns:50px 1fr 50px;gap:6px;align-items:stretch}
.centre{display:flex;flex-direction:column;gap:6px}
.flanc{display:flex}
.flanc .slot{flex:1;height:auto}
.flanc .slot::after{content:"FLANC";position:absolute;top:3px;left:0;right:0;text-align:center;
  font-size:7px;letter-spacing:.12em;color:var(--texte2);opacity:.5}
.flanc .slot.rempli::after{display:none}
.slot{position:relative}
.slot.couvert{opacity:.62}
.slot.couvert::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(90,140,220,.13) 5px 10px);
  pointer-events:none}
.slot.cible.couvert{opacity:1}

/* ───────── VRAIE CARTE ───────── */
.tcg{width:100%;max-width:330px;margin:0 auto;border-radius:15px;padding:3px;
  background:linear-gradient(160deg,var(--bordure,#8B86A8),#1A1533 55%,var(--bordure,#8B86A8));
  box-shadow:0 6px 22px rgba(0,0,0,.45)}
.tcg-in{background:#181334;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.tcg-tete{display:flex;align-items:center;gap:7px;padding:7px 9px 6px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),transparent)}
.tcg-nom{flex:1;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;
  line-height:1.1;letter-spacing:-.01em}
.tcg-cout{flex:0 0 auto;width:27px;height:27px;border-radius:50%;background:var(--energie);
  color:#08241F;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center}
.tcg-art{position:relative;aspect-ratio:.82;background:#0D0B1A;overflow:hidden}
.tcg-art img{width:100%;height:100%;object-fit:cover;display:block}
.tcg-art .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:74px;background:radial-gradient(circle at 50% 38%,#2E2757,#141029)}
.tcg-aff{position:absolute;left:0;right:0;bottom:0;padding:16px 9px 5px;
  background:linear-gradient(transparent,rgba(10,8,24,.92));
  font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#D9D2F5;text-align:center}
.tcg-barres{display:flex;align-items:center;gap:6px;padding:7px 9px;
  border-bottom:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.22)}
.tcg-s{display:flex;align-items:center;gap:3px;font-family:"Bricolage Grotesque",sans-serif;
  font-weight:700;font-size:14px}
.tcg-s i{font-style:normal;font-size:11px;opacity:.8}
.tcg-s.pv{color:var(--vie)}
.tcg-s.df{color:var(--bouclier)}
.tcg-rar{margin-left:auto;font-size:8.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid currentColor}
.tcg-corps{padding:8px 9px 10px;display:flex;flex-direction:column;gap:7px}
.tcg-a{border-left:2px solid var(--bordure,#8B86A8);padding-left:7px}
.tcg-al{display:flex;align-items:baseline;gap:6px}
.tcg-ac{flex:0 0 auto;min-width:17px;height:17px;border-radius:5px;background:var(--energie);
  color:#08241F;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tcg-an{flex:1;font-size:12.5px;font-weight:600;line-height:1.2}
.tcg-ad{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;color:var(--sang)}
.tcg-at{font-size:10.5px;color:var(--texte2);line-height:1.4;margin-top:2px}

function svgScene(cle, ciel1, ciel2, lueur, sol, corps, particules){
  var p = [];
  p.push('<svg viewBox="0 0 100 122" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">');
  p.push('<defs>');
  p.push('<linearGradient id="c' + cle + '" x1="0" y1="0" x2="0" y2="1">');
  p.push('<stop offset="0" stop-color="' + ciel1 + '"/><stop offset="1" stop-color="' + ciel2 + '"/></linearGradient>');
  p.push('<radialGradient id="h' + cle + '" cx="50%" cy="42%" r="55%">');
  p.push('<stop offset="0" stop-color="' + lueur + '" stop-opacity=".85"/>');
  p.push('<stop offset="1" stop-color="' + lueur + '" stop-opacity="0"/></radialGradient>');
  p.push('<linearGradient id="s' + cle + '" x1="0" y1="0" x2="0" y2="1">');
  p.push('<stop offset="0" stop-color="' + sol + '" stop-opacity=".2"/>');
  p.push('<stop offset="1" stop-color="' + sol + '"/></linearGradient>');
  p.push('</defs>');
  p.push('<rect width="100" height="122" fill="url(#c' + cle + ')"/>');
  p.push('<ellipse cx="50" cy="52" rx="52" ry="46" fill="url(#h' + cle + ')"/>');
  if (particules){
    for (var i = 0; i < 16; i++){
      var x = (i * 37) % 97 + 2, y = (i * 53) % 108 + 6, r = (i % 3) * 0.35 + 0.4;
      p.push('<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + lueur + '" opacity="' + (0.15 + (i % 4) * 0.12) + '"/>');
    }
  }
  p.push(corps);
  p.push('<path d="M0 96 L18 88 L34 95 L52 86 L70 94 L86 87 L100 94 L100 122 L0 122 Z" fill="url(#s' + cle + ')"/>');
  p.push('<rect width="100" height="122" fill="none"/>');
  p.push('</svg>');
  return p.join("");
}

var des = [], animDe = false, butinEnCours = null;

var BONUS_SERIE = {
  2:{txt:"S\u00e9rie de 2 \u2014 chance augment\u00e9e", mult:1.2, garanti:null},
  3:{txt:"S\u00e9rie de 3 \u2014 grosse chance", mult:1.5, garanti:null},
  4:{txt:"S\u00e9rie de 4 \u2014 carte rare garantie", mult:1.8, garanti:"rare"},
  5:{txt:"S\u00e9rie de 5 \u2014 carte \u00e9pique garantie", mult:2.2, garanti:"epique"},
  6:{txt:"S\u00e9rie de 6 \u2014 l\u00e9gendaire garantie", mult:3, garanti:"legendaire"}
};

function longueurSerie(){
  if (des.length < 2) return 1;
  var max = 1, n = 1;
  for (var i = 1; i < des.length; i++){
    if (des[i] === des[i-1]) n++; else n = 1;
    if (n > max) max = n;
  }
  return max;
}

function peutRelancer(){
  if (des.length < 2) return true;
  return des[des.length-1] === des[des.length-2];
}

function rendreBoosters(){
  var total = 0, i;
  for (i = 0; i < des.length; i++) total += des[i];
  var lg = longueurSerie();
  var bonus = (des.length > 1 && lg > 1) ? BONUS_SERIE[Math.min(lg, 6)] : null;
  var relance = peutRelancer();

  var p = [];
  p.push('<div class="bloc"><h2>Ouvrir un booster</h2>');
  p.push('<p class="sous">Tu lances toujours deux d\u00e9s. M\u00eame chiffre : tu relances et tu additionnes, et la s\u00e9rie grandit tant que \u00e7a continue.</p>');
  p.push('<div class="des" id="zoneDes">');
  if (des.length){
    for (i = 0; i < des.length; i++){
      p.push('<div class="de' + (i > 0 && des[i] === des[i-1] ? " serie" : "") + '">' + des[i] + '</div>');
    }
  } else {
    p.push('<span class="sous">Aucun d\u00e9 lanc\u00e9</span>');
  }
  p.push('</div>');

  if (des.length){
    p.push('<div class="score"><div class="n">' + total + '</div><div class="l">chance du booster</div></div>');
  }
  if (bonus) p.push('<div class="annonce">' + bonus.txt + '</div>');
  if (jeu.boosters === 0){
    p.push('<p class="sous" style="margin-top:11px">Plus de boosters. Gagne un combat ou ach\u00e8tes-en.</p>');
  }

  var texteLancer;
  if (des.length === 0) texteLancer = "Lancer le premier d\u00e9";
  else if (des.length === 1) texteLancer = "Lancer le deuxi\u00e8me d\u00e9";
  else if (relance) texteLancer = "Relancer \u2014 s\u00e9rie en cours";
  else texteLancer = "S\u00e9rie termin\u00e9e";

  p.push('<button class="btn" id="bLancer"' + ((jeu.boosters === 0 || !relance) ? " disabled" : "") + '>' + texteLancer + '</button>');
  p.push('<button class="btn second" id="bOuvrir"' + (des.length === 0 ? " disabled" : "") + '>Ouvrir le booster</button>');
  p.push('</div>');

  p.push('<div class="bloc"><h2>Boutique</h2><p class="sous">Les pi\u00e8ces viennent des combats.</p>');
  p.push('<button class="btn second" id="bAch1"' + (jeu.pieces < 50 ? " disabled" : "") + '>1 booster \u2014 50 pi\u00e8ces</button>');
  p.push('<button class="btn second" id="bAch5"' + (jeu.pieces < 220 ? " disabled" : "") + '>5 boosters \u2014 220 pi\u00e8ces</button>');
  p.push('</div><div class="bloc" id="resultat" style="display:none"></div>');

  el("v-boosters").innerHTML = p.join("");
  el("bLancer").onclick = lancerDe;
  el("bOuvrir").onclick = ouvrirBooster;
  el("bAch1").onclick = function(){ jeu.pieces -= 50; jeu.boosters += 1; majRessources(); sauver(); rendreBoosters(); };
  el("bAch5").onclick = function(){ jeu.pieces -= 220; jeu.boosters += 5; majRessources(); sauver(); rendreBoosters(); };
}

function lancerDe(){
  if (animDe) return;
  animDe = true;
  var zone = el("zoneDes");
  if (!des.length) zone.innerHTML = "";
  var noeud = document.createElement("div");
  noeud.className = "de roule";
  zone.appendChild(noeud);
  var k = 0;
  function defiler(){
    if (k < 7){
      noeud.textContent = 1 + Math.floor(Math.random() * 6);
      k++; setTimeout(defiler, 62); return;
    }
    var d = 1 + Math.floor(Math.random() * 6);
    noeud.textContent = d;
    if (des.length && des[des.length - 1] === d) noeud.classList.add("serie");
    des.push(d);
    setTimeout(function(){ animDe = false; rendreBoosters(); }, 320);
  }
  defiler();
}

function tirerRarete(total, mult, garanti){
  if (garanti) return garanti;
  var p = Math.min(total * mult, 40);
  var poids = {
    commun: Math.max(100 - p * 6, 10), rare: 20 + p * 1.5,
    epique: Math.max(p * 1.2 - 6, 0), legendaire: Math.max(p * 0.45 - 10, 0)
  };
  var somme = 0, k;
  for (k in poids) somme += poids[k];
  var r = Math.random() * somme;
  for (k in poids){ r -= poids[k]; if (r <= 0) return k; }
  return "commun";
}

function ouvrirBooster(){
  jeu.boosters--;
  var total = 0, i;
  for (i = 0; i < des.length; i++) total += des[i];
  var lg = longueurSerie();
  var bonus = lg > 1 ? BONUS_SERIE[Math.min(lg, 6)] : null;
  var mult = bonus ? bonus.mult : 1;

  var butin = [];
  for (var n = 0; n < 3; n++){
    var rar = tirerRarete(total, mult, (n === 0 && bonus) ? bonus.garanti : null);
    var pool = OBTENABLES.filter(function(c){ return c.rarete === rar; });
    if (!pool.length) pool = OBTENABLES.filter(function(c){ return c.rarete === "commun"; });
    var c = pool[Math.floor(Math.random() * pool.length)];
    var enFrag;
    if (possede(c.id)) enFrag = Math.random() < 0.6;
    else if (rar === "legendaire") enFrag = Math.random() < 0.7;
    else if (rar === "epique") enFrag = Math.random() < 0.4;
    else enFrag = false;
    if (enFrag){
      var q = 4 + Math.floor(Math.random() * 10);
      jeu.fragments[c.id] = (jeu.fragments[c.id] || 0) + q;
      butin.push({c:c, frag:q});
    } else {
      jeu.collection[c.id] = (jeu.collection[c.id] || 0) + 1;
      butin.push({c:c, frag:0});
    }
  }
  des = [];
  majRessources(); sauver(); rendreBoosters();

  var box = el("resultat");
  box.style.display = "block";
  box.innerHTML = '<h2>Booster</h2><p class="sous">Touche le paquet pour r\u00e9v\u00e9ler.</p>'
    + '<div class="paquet" id="paquet">\uD83C\uDF81</div>';
  box.scrollIntoView({behavior:"smooth", block:"center"});
  butinEnCours = butin;
  el("paquet").onclick = function(){ revelerButin(box); };
}

function revelerButin(box){
  var paquet = el("paquet");
  if (!paquet) return;
  paquet.onclick = null;
  paquet.classList.add("secoue");
  setTimeout(function(){
    paquet.classList.add("eclate");
    setTimeout(function(){ afficherButin(box); }, 420);
  }, 500);
}

function afficherButin(box){
  var butin = butinEnCours, p = [], i;
  p.push('<h2>Contenu du booster</h2><div class="revele">');
  for (i = 0; i < butin.length; i++){
    var b = butin[i];
    p.push('<div class="flip" data-f="' + i + '"><div class="face dos">\uD83C\uDFB4</div>');
    p.push('<div class="face r-' + b.c.rarete + (b.c.rarete !== "commun" ? " eclat" : "") + '">');
    p.push('<div class="vis" style="color:var(--texte)">' + visuel(b.c, 32) + '</div>');
    p.push('<div class="nom" style="color:var(--texte)">' + b.c.nom + '</div>');
    if (b.frag){
      p.push('<div class="frag">+' + b.frag + ' fragments</div>');
      p.push('<div class="barref"><i style="width:'
        + Math.min((jeu.fragments[b.c.id] / FRAGMENTS_REQUIS) * 100, 100) + '%"></i></div>');
    } else {
      p.push('<div class="st">' + NOM_RARETE[b.c.rarete] + '</div>');
    }
    p.push('</div></div>');
  }
  p.push('</div>');
  box.innerHTML = p.join("");
  for (i = 0; i < butin.length; i++){
    (function(idx){
      setTimeout(function(){
        var n = box.querySelector('[data-f="' + idx + '"]');
        if (n) n.classList.add("ouvert");
      }, 340 * (idx + 1));
    })(i);
  }
}

   CLASSEUR

function rendreClasseur(){
  var obtenues = OBTENABLES.filter(function(c){ return possede(c.id); }).length;
  var craftables = OBTENABLES.filter(function(c){
    return !possede(c.id) && (jeu.fragments[c.id] || 0) >= FRAGMENTS_REQUIS;
  });
  var p = [], i, c;

  p.push('<div class="bloc"><h2>Classeur</h2>');
  p.push('<p class="sous">' + obtenues + ' cartes sur ' + OBTENABLES.length + '</p>');
  p.push('<div class="grille">');
  for (i = 0; i < OBTENABLES.length; i++){
    c = OBTENABLES[i];
    if (possede(c.id)){
      p.push('<button class="carte r-' + c.rarete + '" data-fiche="' + c.id + '">');
      p.push('<div class="vis" style="color:var(--texte)">' + visuel(c, 30) + '</div>');
      p.push('<div class="nom" style="color:var(--texte)">' + c.nom + '</div>');
      p.push('<div class="st">' + c.pv + ' PV \u00b7 co\u00fbt ' + c.cout + '</div></button>');
    } else {
      var f = jeu.fragments[c.id] || 0;
      p.push('<div class="carte vide"><div class="vis">?</div><div class="nom">Carte inconnue</div>');
      if (f){
        p.push('<div class="st" style="color:var(--or)">' + f + ' / ' + FRAGMENTS_REQUIS + '</div>');
        p.push('<div class="barref"><i style="width:' + Math.min(f / FRAGMENTS_REQUIS * 100, 100) + '%"></i></div>');
      } else {
        p.push('<div class="st">Aucun fragment</div>');
      }
      p.push('</div>');
    }
  }
  p.push('</div></div>');

  if (craftables.length){
    p.push('<div class="bloc"><h2>Pr\u00eates \u00e0 fabriquer</h2><div class="liste">');
    for (i = 0; i < craftables.length; i++){
      c = craftables[i];
      p.push('<button class="item" data-craft="' + c.id + '">');
      p.push('<span class="av">' + visuel(c, 19) + '</span>');
      p.push('<span style="flex:1"><span class="t">' + c.nom + '</span><br>');
      p.push('<span class="d">' + FRAGMENTS_REQUIS + ' fragments r\u00e9unis</span></span>');
      p.push('<span style="color:var(--or);font-weight:600;font-size:13px">Fabriquer</span></button>');
    }
    p.push('</div></div>');
  }

  el("v-classeur").innerHTML = p.join("");
  brancher("v-classeur", "[data-fiche]", function(b){ ficheCarte(b.dataset.fiche); });
  brancher("v-classeur", "[data-craft]", function(b){
    jeu.fragments[b.dataset.craft] -= FRAGMENTS_REQUIS;
    jeu.collection[b.dataset.craft] = 1;
    sauver(); rendreClasseur();
  });
}

function motsCles(a){
  var t = [];
  t.push(a.portee === "corps" ? "Contact" : "Distance");
  if (a.cible === "perce") t.push("Per\u00e7ant");
  if (a.cible === "colonne") t.push("Colonne");
  if (a.cible === "rangee") t.push("Rang\u00e9e");
  if (a.cible === "tous") t.push("Tout le terrain");
  if (a.ignore) t.push("Ignore bouclier");
  if (a.gel) t.push("Gel");
  if (a.brule) t.push("Br\u00fblure");
  if (a.provoc) t.push("Provocation");
  if (a.invoque) t.push("Invocation");
  if (a.intouchable) t.push("Intouchable");
  if (a.renvoi) t.push("Renvoi " + a.renvoi);
  if (a.renvoiEquipe) t.push("Renvoi d'équipe " + a.renvoiEquipe);
  if (a.soin) t.push("Soin " + a.soin);
  if (a.bouclier || a.bouclierSoi) t.push("Bouclier " + (a.bouclier || a.bouclierSoi));
  if (a.energie) t.push("+" + a.energie + " \u00e9nergie");
  if (a.purifie) t.push("Purification");
  if (a.saign) t.push("Saignement " + a.saign);
  if (a.recul) t.push("Recul " + a.recul);
  return t;
}

var C = null, sel = null, uidC = 0;

      var k2 = combosPossibles[j];

function creerUnite(id, campNom){
  var c = parId[id];
  var e = campNom === "ennemi" ? 1 + 0.06 * (jeu.niveau - 1) : 1;
  return {
    uid: ++uidC, c:c, camp:campNom, zone:null, i:null,
    pvMax: Math.round(c.pv * e), pv: Math.round(c.pv * e),
    defMax: Math.round(c.def * e), def: Math.round(c.def * e),
    ech: e, blesse: 0, mort: false, aAgi: false, provoc: false,
    gele: false, intouchable: false, brule: false, renvoi: 0,
    enchaine: false, etendard: false,
    bonusAtk: 0, survieUtilisee: false, tourPose: 0, duree: 0
  };
}

function melanger(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function deckJoueur(){
  var d = [];
  for (var i = 0; i < OBTENABLES.length; i++){
    var n = jeu.collection[OBTENABLES[i].id] || 0;
    for (var k = 0; k < n; k++) d.push(OBTENABLES[i].id);
  }
  return melanger(d);
}

function deckEnnemi(){
  var n = jeu.niveau;
  var pool = OBTENABLES.filter(function(c){
    if (c.rarete === "commun") return true;
    if (c.rarete === "rare") return n >= 4;
    if (c.rarete === "epique") return n >= 8;
    return n >= 12;
  });
  var d = [];
  for (var k = 0; k < 14; k++) d.push(pool[Math.floor(Math.random() * pool.length)].id);
  return d;
}

function demarrer(){
  C = {
    joueur: [], ennemi: [],
    pioche: deckJoueur(), main: [],
    piocheE: deckEnnemi(), mainE: [],
    energie: 4, energieE: 3,
    tour: 1, journal: [], fini: false, gagne: false, occupe: false,
    pts: 0, ptsE: 0, defausseFaite: false, combosSignales: {}
  };
  for (var k = 0; k < 4; k++){ piocher("joueur"); piocher("ennemi"); }
  log("Tour 1 \u2014 \u00e0 toi de jouer.", true);
  rendreTerrain();
}

function piocher(campNom){
  if (campNom === "joueur"){
    if (!C.pioche.length) C.pioche = deckJoueur();
    if (C.main.length < 7 && C.pioche.length) C.main.push(C.pioche.pop());
  } else {
    if (!C.piocheE.length) C.piocheE = deckEnnemi();
    if (C.mainE.length < 7 && C.piocheE.length) C.mainE.push(C.piocheE.pop());
  }
}

function vivants(a){ return a.filter(function(u){ return !u.mort; }); }
function equipe(n){ return n === "joueur" ? C.joueur : C.ennemi; }
function adverse(n){ return n === "joueur" ? C.ennemi : C.joueur; }

function occupeSlot(n, z, i){
  return equipe(n).some(function(u){ return !u.mort && u.zone === z && u.i === i; });
}
function indexLibre(n, z){
  var max = z === "cote" ? 2 : 3;
  for (var i = 0; i < max; i++) if (!occupeSlot(n, z, i)) return i;
  return -1;
}
function placeLibre(n, z){ return indexLibre(n, z) !== -1; }

/* ── combos ── */
function combosActifs(n){
  var v = vivants(equipe(n)).map(function(u){ return u.c.id; });
  return COMBOS.filter(function(k){
    return k.cartes.every(function(x){ return v.indexOf(x) !== -1; });
  });
}
function aCombo(n, type){
  return combosActifs(n).some(function(k){ return k.type === type; });
}
function comboVal(n, type, cibleId){
  var total = 0;
  combosActifs(n).forEach(function(k){
    if (k.type !== type) return;
    if (cibleId && k.cible && k.cible !== cibleId) return;
    total += (k.val || 0);
  });
  return total;
}

function bonusAura(n){
  var b = comboVal(n, "atkEquipeRisque");
  if (vivants(equipe(n)).some(function(u){ return u.c.passif === "forge"; })) b += 0;
  return b;
}

function gainEnergie(n){
  var base = Math.min(7, GAIN_BASE + Math.floor(C.tour / 2));
  return base + comboVal(n, "energie");
}

function log(t, imp, mal){
  C.journal.push({t:t, imp:imp, mal:mal});
  if (C.journal.length > 70) C.journal.shift();
}

/* ── mort et effets caches ── */
function tuer(u){
  if (u.mort) return;

  // Le Serment : le Compagnon survit une fois a 1 PV.
  if (u.c.id === "compagnon" && !u.survieUtilisee && aCombo(u.camp, "survie")){
    u.survieUtilisee = true; u.pv = 1; u.blesse = 0;
    log("Le Serment : " + u.c.nom + " survit avec 1 PV.", true);
    return;
  }

  u.mort = true; u.pv = 0;
  var pts = VALEUR_POINTS[u.c.rarete] || 1;
  if (!u.c.invocation){
    if (u.camp === "ennemi") C.pts += pts; else C.ptsE += pts;
    log(u.c.nom + " est \u00e9limin\u00e9 \u2014 " + pts + (pts > 1 ? " points pour " : " point pour ")
      + (u.camp === "ennemi" ? "toi" : "l'ennemi") + ".", true);
  } else {
    log(u.c.nom + " se dissipe.");
  }

  var allies = equipe(u.camp), ennemisDe = adverse(u.camp);

  // Le Compagnon legue sa force a la carte devant lui.
  if (u.c.id === "compagnon"){
    var devant = vivants(allies).filter(function(x){ return x.zone === "avant" && x.i === u.i; });
    if (devant.length){
      devant[0].bonusAtk += 12;
      log("Le Compagnon l\u00e8gue sa force \u00e0 " + devant[0].c.nom + " : +12 d\u00e9g\u00e2ts.", true);
    }
  }
  // La Sentinelle se brise et redistribue ses eclats.
  if (u.c.id === "sentinelle"){
    log("La Sentinelle se brise : 25 de bouclier pour toutes tes cartes.", true);
    vivants(allies).forEach(function(x){
      if (x.defMax === 0) x.defMax = 25;
      x.def = Math.min(x.defMax, x.def + 25);
    });
  }
  // Le Forgeron recupere le metal des siens.
  vivants(allies).forEach(function(x){
    if (x.c.id === "forgeron"){ x.def += 12; log("Le Forgeron r\u00e9cup\u00e8re le m\u00e9tal : +12 bouclier."); }
  });
  // Le Necromancien moissonne toutes les morts, des deux camps.
  [allies, ennemisDe].forEach(function(groupe){
    vivants(groupe).forEach(function(x){
      if (x.c.id === "necromancien"){ x.bonusAtk += 5; }
    });
  });
  // Le Titan s'effondre sur tout le monde.
  if (u.c.id === "titan"){
    log("Le Titan s'effondre : 40 d\u00e9g\u00e2ts sur tout le camp adverse.", true);
    vivants(ennemisDe).slice().forEach(function(x){
      x.pv -= 40;
      nombreFlottant(x.uid, "\u221240", "var(--sang)");
      if (x.pv <= 0) tuer(x);
    });
  }
  // Le tueur regagne du bouclier, la Maree Noire rend de l'energie.
  if (u.camp === "ennemi"){
    if (aCombo("joueur", "energieMort")){
      C.energie = Math.min(ENERGIE_MAX, C.energie + comboVal("joueur", "energieMort"));
      log("La Mar\u00e9e Noire : +2 \u00e9nergie.");
    }
  }
}

/* ── ciblage ── */
function gardien(x){
  // La carte avant de la MEME colonne, et elle seule, protege celle de derriere.
  if (x.zone !== "arriere") return null;
  var g = equipe(x.camp).filter(function(y){
    return !y.mort && y.zone === "avant" && y.i === x.i;
  });
  return g.length ? g[0] : null;
}

function estCiblable(x, perce){
  if (x.mort || x.intouchable) return false;
  if (x.c.id === "ombre" && x.tourPose === C.tour) return false;
  if (x.zone === "arriere"){
    if (perce) return !aCombo(x.camp, "antiPerce");
    // protegee uniquement si sa propre colonne avant est tenue
    if (gardien(x)) return false;
  }
  // Les emplacements cote sont sur les flancs : personne ne les couvre.
  return true;
}

function ciblesValides(u, a){
  if (a.cible === "soi") return [u.uid];
  if (a.cible === "allie") return vivants(equipe(u.camp)).map(function(x){ return x.uid; });
  var adv = adverse(u.camp);
  var perce = (a.cible === "perce");
  var dispo = adv.filter(function(x){ return estCiblable(x, perce); });
  var prov = dispo.filter(function(x){ return x.provoc; });
  if (prov.length) return prov.map(function(x){ return x.uid; });
  if (a.cible === "tous" || a.cible === "rangee"){
    var z = a.cible === "rangee" ? ["avant"] : ["avant","arriere","cote"];
    var l = dispo.filter(function(x){ return z.indexOf(x.zone) !== -1; });
    return (l.length ? l : dispo).map(function(x){ return x.uid; });
  }
  return dispo.map(function(x){ return x.uid; });
}

function attaqueUtilisable(u, a){
  if (u.mort || u.aAgi || u.gele) return false;
  if (a.portee === "corps" && u.zone !== "avant") return false;
  var e = u.camp === "joueur" ? C.energie : C.energieE;
  if (a.c > e) return false;
  if (a.invoque && indexLibre(u.camp, "avant") === -1 && indexLibre(u.camp, "arriere") === -1) return false;
  return ciblesValides(u, a).length > 0;
}

/* ── degats ── */
function bonusDegats(u){
  var b = u.bonusAtk;
  b += comboVal(u.camp, "atkCible", u.c.id);
  b += comboVal(u.camp, "atkEquipeRisque");
  combosActifs(u.camp).forEach(function(k){
    if (k.type === "atkDuo" && k.cartes.indexOf(u.c.id) !== -1) b += k.val;
  });
  if (u.c.id === "ange") b += Math.floor((u.pvMax - u.pv) / 5);
  if (vivants(equipe(u.camp)).some(function(x){ return x.c.passif === "forge"; }) && u.zone === "avant") b += 0;
  return b;
}

function appliquerDegats(att, def, a, mult){
  var brut = a.d + bonusDegats(att);
  if (a.cible === "perce" || a.ignore) brut += comboVal(att.camp, "atkPerce");
  // L'Archer vise justement ce que la ligne de front croit prot\u00e9ger.
  if (att.c.id === "archer" && gardien(def)) brut += 12;
  var d = Math.round(brut * (mult || 1) * att.ech);
  // La Derni\u00e8re Ligne encaisse pour la rang\u00e9e avant.
  if (def.zone === "avant"){
    var red = 0;
    combosActifs(def.camp).forEach(function(k){ if (k.type === "reductionAvant") red += k.val; });
    if (red > 0) d = Math.round(d * (1 - Math.min(red, 0.5)));
  }
  var ignore = a.ignore || (a.portee === "loin" && aCombo(att.camp, "ignoreDef"));
  var auxPV = false, absorbe = 0, reste = 0;

  if (ignore){ def.pv -= d; auxPV = true; reste = d; }
  else {
    absorbe = Math.min(def.def, d);
    def.def -= absorbe;
    reste = d - absorbe;
    if (reste > 0){ def.pv -= reste; auxPV = true; }
  }

  var sg = a.saign || 0;
  if (sg && aCombo(att.camp, "saignementX2")) sg *= 2;
  if (sg) sg += comboVal(att.camp, "saignPlus");
  if (def.c.secretId === "sansSang") sg = 0;
  if (auxPV && sg > def.blesse){
    def.blesse = sg;
    log(def.c.nom + " saigne \u2014 " + sg + " PV par tour.", false, true);
  }
  if (a.brule && !def.brule){
    def.brule = true;
    log(def.c.nom + " est br\u00fbl\u00e9 : il ne peut plus \u00eatre soign\u00e9.", true, true);
  }
  if (a.gel && !def.mort){
    def.gele = true;
    log(def.c.nom + " est gel\u00e9 : il ne pourra pas agir au prochain tour.", true);
  }
  if (def.renvoi > 0 && !att.mort){
    att.pv -= def.renvoi;
    nombreFlottant(att.uid, "\u2212" + def.renvoi, "var(--sang)");
    log(def.c.nom + " renvoie " + def.renvoi + " d\u00e9g\u00e2ts.");
    if (att.pv <= 0) tuer(att);
  }
  if (def.pv <= 0){
    tuer(def);
    if (def.mort && att.c.id === "rodeur" && !att.mort && !att.enchaine){
      att.enchaine = true; att.aAgi = false;
      log("Le R\u00f4deur encha\u00eene : il peut agir une seconde fois.", true);
    }
    if (def.mort && att.c.id === "chevalier" && !att.mort){
      att.def = Math.min(att.defMax, att.def + 15);
      log("Le Chevalier-Dragon regagne 15 de bouclier.");
    }
    if (def.mort && def.blesse > 0){
      vivants(equipe(att.camp)).forEach(function(x){
        if (x.c.id === "alchimiste"){
          x.pv = Math.min(x.pvMax, x.pv + 15);
          log("L'Alchimiste r\u00e9cup\u00e8re 15 PV.");
        }
      });
    }
  }
  return {absorbe:absorbe, reste:reste, total:d};
}

function anim(uid, cls){
  var n = document.querySelector('[data-uid="' + uid + '"]');
  if (!n) return Promise.resolve();
  n.classList.add(cls);
  return dors(cls === "bond" ? 260 : 340).then(function(){ n.classList.remove(cls); });
}

function nombreFlottant(uid, txt, couleur){
  var n = document.querySelector('[data-uid="' + uid + '"]');
  if (!n) return;
  var s = document.createElement("span");
  s.className = "nombre"; s.style.color = couleur; s.textContent = txt;
  n.appendChild(s);
  setTimeout(function(){ s.remove(); }, 1000);
}

function invoquer(n){
  var z = indexLibre(n, "avant") !== -1 ? "avant" : "arriere";
  var i = indexLibre(n, z);
  if (i === -1) return null;
  var u = creerUnite("ame", n);
  if (aCombo(n, "amesFortes")){ u.pvMax = 60; u.pv = 60; u.duree = 99; }
  else u.duree = 3;
  u.zone = z; u.i = i; u.aAgi = true; u.tourPose = C.tour;
  equipe(n).push(u);
  return u;
}

function executer(u, a, cibleUid){
  if (u.camp === "joueur") C.energie -= a.c; else C.energieE -= a.c;
  u.aAgi = true;

  if (a.cible === "soi"){
    if (a.energie){
      if (u.camp === "joueur") C.energie = Math.min(ENERGIE_MAX, C.energie + a.energie);
      else C.energieE = Math.min(ENERGIE_MAX, C.energieE + a.energie);
      nombreFlottant(u.uid, "+" + a.energie + " \u26a1", "var(--energie)");
      log(u.c.nom + " \u2014 " + a.n + " : +" + a.energie + " \u00e9nergie.");
    }
    if (a.recul){
      u.pv = Math.max(1, u.pv - a.recul);
      nombreFlottant(u.uid, "\u2212" + a.recul, "var(--sang)");
    }
    if (a.provoc){ u.provoc = true; log(u.c.nom + " provoque : l'adversaire doit le viser.", true); }
    if (a.bouclierSoi){
      u.def = Math.min(u.defMax, u.def + a.bouclierSoi);
      nombreFlottant(u.uid, "+" + a.bouclierSoi, "var(--bouclier)");
    }
    if (a.renvoi){ u.renvoi = a.renvoi; log(u.c.nom + " renverra " + a.renvoi + " d\u00e9g\u00e2ts \u00e0 chaque attaquant."); }
    if (a.renvoiEquipe){
      vivants(equipe(u.camp)).forEach(function(x){ x.renvoi = Math.max(x.renvoi, a.renvoiEquipe); });
      log("Couronne d'\u00e9pines : toutes tes cartes renvoient " + a.renvoiEquipe + " d\u00e9g\u00e2ts.", true);
    }
    if (a.intouchable){ u.intouchable = true; log(u.c.nom + " dispara\u00eet : intouchable jusqu'\u00e0 ton prochain tour.", true); }
    if (a.invoque){
      var inv = invoquer(u.camp);
      if (inv) log(u.c.nom + " rel\u00e8ve une \u00c2me Errante (" + inv.pvMax + " PV).", true);
    }
    return anim(u.uid, "bond");
  }

  if (a.cible === "allie"){
    var t = equipe(u.camp).filter(function(x){ return x.uid === cibleUid; })[0];
    if (a.soin){
      if (t.brule){ log(t.c.nom + " est br\u00fbl\u00e9 : le soin n'a aucun effet.", false, true); }
      else {
        var puiss = (u.zone === "cote" && u.c.id === "pretre") ? 18 : a.soin;
        var rendu = Math.min(puiss, t.pvMax - t.pv);
        t.pv += rendu;
        nombreFlottant(t.uid, "+" + rendu, "var(--vie)");
        log(u.c.nom + " soigne " + t.c.nom + " de " + rendu + " PV.");
        if (u.zone === "cote"){
          var autres = vivants(equipe(u.camp)).filter(function(x){
            return x.uid !== t.uid && x.zone !== t.zone && x.zone !== "cote" && x.pv < x.pvMax && !x.brule;
          }).sort(function(x, y){ return x.pv / x.pvMax - y.pv / y.pvMax; });
          if (autres.length){
            var r2 = Math.min(18, autres[0].pvMax - autres[0].pv);
            autres[0].pv += r2;
            nombreFlottant(autres[0].uid, "+" + r2, "var(--vie)");
            log("Depuis le c\u00f4t\u00e9, il soigne aussi " + autres[0].c.nom + ".");
          }
        }
      }
    }
    if (a.bouclier){
      var rb = Math.min(a.bouclier, Math.max(0, t.defMax - t.def));
      if (t.defMax === 0){ t.defMax = a.bouclier; rb = a.bouclier; }
      t.def += rb;
      nombreFlottant(t.uid, "+" + rb, "var(--bouclier)");
      log(u.c.nom + " rend " + rb + " de bouclier \u00e0 " + t.c.nom + ".");
    }
    if (a.purifie){
      t.blesse = 0;
      t.pv = Math.min(t.pvMax, t.pv + 10);
      nombreFlottant(t.uid, "\u2726", "var(--or)");
      log(u.c.nom + " purifie " + t.c.nom + ".", true);
    }
    return anim(u.uid, "bond");
  }

  var adv = adverse(u.camp);
  var principal = adv.filter(function(x){ return x.uid === cibleUid; })[0];
  var touches = [principal], mult = 1;

  if (a.cible === "colonne"){
    var col = vivants(adv).filter(function(x){ return x.i === principal.i && x.zone !== "cote"; });
    if (col.length) touches = col;
  } else if (a.cible === "rangee"){
    var r = vivants(adv).filter(function(x){ return x.zone === "avant"; });
    if (r.length) touches = r;
  } else if (a.cible === "tous"){
    touches = vivants(adv).slice();
  }

  // Les Anciens : une cible de plus sur les attaques multiples.
  if (aCombo(u.camp, "anciens") && touches.length > 1){
    var rest = vivants(adv).filter(function(x){ return touches.indexOf(x) === -1; });
    if (rest.length) touches.push(rest[0]);
  }

  return anim(u.uid, "bond").then(function(){
    for (var k = 0; k < touches.length; k++){
      var t2 = touches[k];
      if (t2.mort) continue;
      var res = appliquerDegats(u, t2, a, mult);
      nombreFlottant(t2.uid, "\u2212" + res.total, res.reste > 0 ? "var(--sang)" : "var(--bouclier)");
      anim(t2.uid, "frappe");
      log(u.c.nom + " \u2014 " + a.n + " sur " + t2.c.nom + " : " + res.absorbe
        + " au bouclier, " + res.reste + " aux PV.");
    }
    if (a.recul){
      u.pv = Math.max(1, u.pv - a.recul);
      nombreFlottant(u.uid, "\u2212" + a.recul, "var(--sang)");
      log(u.c.nom + " se blesse de " + a.recul + " PV.", false, true);
    }
    return dors(240);
  });
}

function finDeTour(n){
  var v = vivants(equipe(n));
  var malusChute = 0;
  combosActifs(n).forEach(function(k){ if (k.malus) malusChute += k.malus; });
  var benediction = v.some(function(x){ return x.c.id === "pretre"; });

  for (var i = 0; i < v.length; i++){
    var u = v[i];
    var saign = u.blesse;
    if (benediction && saign > 5) saign = 5;
    if (saign > 0){
      u.pv -= saign;
      nombreFlottant(u.uid, "\u2212" + saign, "var(--sang)");
      if (u.pv <= 0){ log(u.c.nom + " succombe \u00e0 ses blessures.", false, true); tuer(u); }
    }
    if (u.mort) continue;
    if (malusChute){
      u.pv -= malusChute;
      if (u.pv <= 0){ log(u.c.nom + " s'\u00e9puise sous La Chute.", false, true); tuer(u); continue; }
    }
    // Anciennete : le Prince grandit a chaque tour survecu.
    if (u.c.id === "prince"){
      u.pvMax += 8; u.pv += 8; u.bonusAtk += 3;
    }
    // Combo Noyau Runique et Mur de Verre.
    var regen = comboVal(n, "regenCible", u.c.id);
    if (u.zone === "avant") regen += comboVal(n, "regenAvant");
    if (regen && u.def < u.defMax) u.def = Math.min(u.defMax, u.def + regen);
    // La Reine se nourrit du sang qu'elle a fait couler.
    if (u.c.id === "reine"){
      var saignants = vivants(adverse(n)).filter(function(x){ return x.blesse > 0; }).length;
      if (saignants){
        var rendu = Math.min(saignants * 6, u.pvMax - u.pv);
        if (rendu > 0){ u.pv += rendu; nombreFlottant(u.uid, "+" + rendu, "var(--vie)"); }
      }
    }
    // Les ames s'effacent.
    if (u.duree > 0 && u.duree < 90){
      u.duree--;
      if (u.duree <= 0) tuer(u);
    }
    u.provoc = false;
    u.renvoi = 0;
    u.enchaine = false;
  }
  // La Couronne Ardente ronge le bouclier des cartes qui saignent.
  var ronge = comboVal(n, "rongeBouclier");
  if (ronge){
    vivants(adverse(n)).forEach(function(x){ if (x.blesse > 0) x.def = Math.max(0, x.def - ronge); });
  }
  appliquerEtendard(n);
}

function appliquerEtendard(n){
  // Le H\u00e9raut raidit la carte plac\u00e9e juste derri\u00e8re lui.
  vivants(equipe(n)).forEach(function(x){
    var g = gardien(x);
    var doitAvoir = !!(g && g.c.id === "heraut");
    if (doitAvoir && !x.etendard){
      x.etendard = true; x.defMax += 10; x.def += 10;
    } else if (!doitAvoir && x.etendard){
      x.etendard = false; x.defMax -= 10; x.def = Math.max(0, x.def - 10);
    }
  });
}

function verifierFin(){
  if (C.pts >= POINTS_VICTOIRE) return terminer(true);
  if (C.ptsE >= POINTS_VICTOIRE) return terminer(false);
  if (C.tour >= TOUR_MAX) return terminer(C.pts >= C.ptsE);
  return false;
}

function terminer(gagne){
  C.fini = true; C.gagne = gagne;
  if (gagne){
    var g = 30 + jeu.niveau * 10 + Math.max(0, C.pts - C.ptsE) * 5;
    jeu.pieces += g; jeu.boosters += 1; jeu.niveau += 1;
    log("Victoire " + C.pts + " \u00e0 " + C.ptsE + ". " + g + " pi\u00e8ces et 1 booster.", true);
  } else {
    jeu.pieces += 10;
    log("D\u00e9faite " + C.pts + " \u00e0 " + C.ptsE + ". 10 pi\u00e8ces de consolation.", true, true);
  }
  majRessources(); sauver(); rendreTerrain();
  return true;
}

function finirTour(){
  if (C.occupe || C.fini) return;
  C.occupe = true; sel = null;
  log("Fin de ton tour.", true);
  rendreTerrain();

  return dors(430)
    .then(function(){ return tourEnnemi(); })
    .then(function(){
      if (C.fini){ C.occupe = false; return; }
      finDeTour("joueur"); finDeTour("ennemi");
      rendreTerrain();
      return dors(400).then(function(){
        if (verifierFin()){ C.occupe = false; return; }
        C.tour += 1;
        var gj = gainEnergie("joueur");
        C.energie = Math.min(ENERGIE_MAX, C.energie + gj);
        C.energieE = Math.min(ENERGIE_MAX, C.energieE + gainEnergie("ennemi"));
        [C.joueur, C.ennemi].forEach(function(grp){
          grp.forEach(function(u){
            u.aAgi = u.gele;
            u.gele = false;
            if (u.camp === "joueur") u.intouchable = false;
          });
        });
        C.defausseFaite = false;
        piocher("joueur"); piocher("ennemi");
        log("Tour " + C.tour + " \u2014 +" + gj + " \u00e9nergie.", true);
        signalerCombos();
        C.occupe = false;
        rendreTerrain();
      });
    });
}

function signalerCombos(){
  combosActifs("joueur").forEach(function(k){
    if (!C.combosSignales[k.id]){
      C.combosSignales[k.id] = true;
      log("Combo actif : " + k.nom + " \u2014 " + k.desc, true);
    }
  });
}

/* ── IA ── */
function tourEnnemi(){
  log("Tour de l'ennemi.", true);
  rendreTerrain();
  return dors(380).then(poserIA);
}

function poserIA(){
  var jouables = [];
  for (var i = 0; i < C.mainE.length; i++){
    var c = parId[C.mainE[i]];
    var zoneOk = c.pos.filter(function(z){ return placeLibre("ennemi", z); });
    if (c.cout <= C.energieE && zoneOk.length) jouables.push({idx:i, c:c, z:zoneOk[0]});
  }
  if (!jouables.length) return attaquerIA(0);

  jouables.sort(function(a, b){ return b.c.cout - a.c.cout; });
  var ch = jouables[0];
  C.energieE -= ch.c.cout;
  C.mainE.splice(ch.idx, 1);
  var u = creerUnite(ch.c.id, "ennemi");
  u.zone = ch.z; u.i = indexLibre("ennemi", ch.z); u.aAgi = true; u.tourPose = C.tour;
  C.ennemi.push(u);
  appliquerEtendard("ennemi");
  log("L'ennemi pose " + u.c.nom + ".");
  rendreTerrain();
  return dors(400).then(poserIA);
}

function attaquerIA(k){
  var v = vivants(C.ennemi);
  if (k >= v.length || C.fini) return dors(260);
  var u = v[k];
  if (u.aAgi || u.gele) return attaquerIA(k + 1);

  var dispo = u.c.attaques.filter(function(a){ return attaqueUtilisable(u, a); });
  if (!dispo.length) return attaquerIA(k + 1);
  dispo.sort(function(a, b){ return (b.d + (b.energie ? 18 : 0)) - (a.d + (a.energie ? 18 : 0)); });
  var a = dispo[0];
  var cs = ciblesValides(u, a);
  if (!cs.length) return attaquerIA(k + 1);

  var cible = cs[0];
  if (a.cible === "allie"){
    var bl = vivants(C.ennemi).filter(function(x){ return x.pv < x.pvMax; })
      .sort(function(x, y){ return x.pv / x.pvMax - y.pv / y.pvMax; });
    if (!bl.length) return attaquerIA(k + 1);
    cible = bl[0].uid;
  } else if (a.cible !== "soi"){
    var objets = cs.map(function(id){ return C.joueur.filter(function(x){ return x.uid === id; })[0]; })
      .filter(Boolean);
    objets.sort(function(x, y){ return (x.pv + x.def) - (y.pv + y.def); });
    if (objets.length) cible = objets[0].uid;
  }

  return executer(u, a, cible)
    .then(function(){ rendreTerrain(); return dors(280); })
    .then(function(){
      if (C.ptsE >= POINTS_VICTOIRE){ terminer(false); return; }
      return attaquerIA(k + 1);
    });
}

/* ── rendu ── */
function uniteHTML(u){
  var p = [];
  p.push('<span class="sv">' + visuel(u.c, 21) + '</span>');
  p.push('<span class="sn">' + u.c.nom + '</span>');
  p.push('<span class="jauge pv"><i style="width:' + (u.pv / u.pvMax * 100) + '%"></i></span>');
  if (u.defMax) p.push('<span class="jauge def"><i style="width:' + (u.def / u.defMax * 100) + '%"></i></span>');
  if (u.blesse > 0 && !u.mort) p.push('<span class="etiq">saigne ' + u.blesse + '</span>');
  if (u.brule) p.push('<span class="etiq">br\u00fbl\u00e9</span>');
  if (u.gele) p.push('<span class="etiq" style="color:var(--bouclier)">gel\u00e9</span>');
  if (u.intouchable) p.push('<span class="etiq" style="color:var(--epique)">intouchable</span>');
  if (u.provoc) p.push('<span class="etiq" style="color:var(--or)">provoque</span>');
  if (gardien(u)) p.push('<span class="etiq" style="color:var(--bouclier)">couverte</span>');
  if (u.aAgi && u.camp === "joueur" && !u.mort && !u.gele) p.push('<span class="etiq" style="color:var(--texte2)">a agi</span>');
  return p.join("");
}

function slotHTML(n, z, i){
  var trouve = equipe(n).filter(function(x){ return x.zone === z && x.i === i && !x.mort; });
  var u = trouve.length ? trouve[0] : null;
  var noms = {avant:"avant", arriere:"arri\u00e8re", cote: i === 0 ? "c\u00f4t\u00e9 G" : "c\u00f4t\u00e9 D"};
  var cls = "slot", attrs = "";
  if (u){
    cls += " rempli";
    attrs = ' data-uid="' + u.uid + '"';
    if (C && gardien(u)) cls += " couvert";
    if (n === "joueur" && (u.aAgi || u.gele)) cls += " epuise";
    if (sel && sel.type === "attaque" && sel.cibles.indexOf(u.uid) !== -1) cls += " cible";
  } else if (sel && sel.type === "main" && n === "joueur" && sel.zones.indexOf(z) !== -1){
    cls += " libre";
  }
  return '<div class="' + cls + '"' + attrs + ' data-slot data-camp="' + n + '" data-z="' + z
    + '" data-i="' + i + '">' + (u ? uniteHTML(u) : noms[z]) + '</div>';
}

function terrainHTML(n, inverse){
  // Les deux emplacements cote encadrent le bloc de six, un a gauche un a droite.
  var p = [], r = inverse ? ["arriere", "avant"] : ["avant", "arriere"], i;
  p.push('<div class="champ">');
  p.push('<div class="flanc">' + slotHTML(n, "cote", 0) + '</div>');
  p.push('<div class="centre">');
  p.push('<div class="rangee">');
  for (i = 0; i < 3; i++) p.push(slotHTML(n, r[0], i));
  p.push('</div><div class="rangee">');
  for (i = 0; i < 3; i++) p.push(slotHTML(n, r[1], i));
  p.push('</div></div>');
  p.push('<div class="flanc">' + slotHTML(n, "cote", 1) + '</div>');
  p.push('</div>');
  return p.join("");
}

function rendreTerrain(){
  var p = [], i;
  p.push('<div class="bloc">');
  p.push('<div class="score-l"><span>Ennemi \u00b7 niveau ' + jeu.niveau + ' \u00b7 ' + C.energieE
    + ' \u26a1 \u00b7 ' + C.mainE.length + ' en main</span>');
  p.push('<span class="pts">' + C.ptsE + ' / ' + POINTS_VICTOIRE + '</span></div>');
  p.push('<div class="terrain">' + terrainHTML("ennemi", true) + '</div>');
  p.push('<div class="sep"></div>');
  p.push('<div class="terrain">' + terrainHTML("joueur", false) + '</div>');

  var actifs = combosActifs("joueur");
  if (actifs.length){
    p.push('<div style="margin-top:9px">');
    for (i = 0; i < actifs.length; i++){
      p.push('<div class="combo-actif">\u2726 ' + actifs[i].nom + '</div>');
    }
    p.push('</div>');
  }

  p.push('<div class="score-l" style="margin-top:8px"><span>Toi \u00b7 tour ' + C.tour + ' sur ' + TOUR_MAX + '</span>');
  p.push('<span class="pts">' + C.pts + ' / ' + POINTS_VICTOIRE + '</span></div>');
  p.push('<div class="barreE"><span class="eTexte">' + C.energie + ' \u26a1</span><span class="pastilles">');
  for (i = 0; i < ENERGIE_MAX; i++) p.push('<span class="pas' + (i < C.energie ? " plein" : "") + '"></span>');
  p.push('</span></div>');

  p.push('<div class="main">');
  if (C.main.length){
    for (i = 0; i < C.main.length; i++){
      var c = parId[C.main[i]];
      var jouable = c.cout <= C.energie && c.pos.some(function(z){ return placeLibre("joueur", z); });
      var choisie = sel && sel.type === "main" && sel.idx === i;
      p.push('<button class="mc' + (jouable ? " jouable" : "") + (choisie ? " select" : "")
        + '" data-m="' + i + '"' + (jouable ? "" : " disabled") + '>');
      p.push('<div class="mv">' + visuel(c, 23) + '</div>');
      p.push('<div class="mn">' + c.nom + '</div>');
      p.push('<div class="mcout">' + c.cout + ' \u26a1</div></button>');
    }
  } else p.push('<span class="sous">Main vide</span>');
  p.push('</div>');

  p.push('<div class="journal" id="journal">');
  for (i = 0; i < C.journal.length; i++){
    var l = C.journal[i];
    p.push('<p class="' + (l.imp ? "imp" : "") + (l.mal ? " mal" : "") + '">' + l.t + '</p>');
  }
  p.push('</div>');

  if (C.fini){
    p.push('<button class="btn" id="bFin">' + (C.gagne ? "Victoire \u2014 continuer" : "D\u00e9faite \u2014 r\u00e9essayer") + '</button>');
  } else {
    p.push('<button class="btn" id="bTour"' + (C.occupe ? " disabled" : "") + '>'
      + (C.occupe ? "L'ennemi joue\u2026" : "Terminer le tour") + '</button>');
    if (sel) p.push('<button class="btn second" id="bAnn">Annuler la s\u00e9lection</button>');
    else if (C.main.length && !C.defausseFaite && !C.occupe){
      p.push('<button class="btn second" id="bDef">D\u00e9fausser une carte pour +2 \u26a1</button>');
    }
  }
  p.push('</div>');

  el("v-combat").innerHTML = p.join("");
  var j = el("journal");
  if (j) j.scrollTop = j.scrollHeight;

  if (C.fini){
    el("bFin").onclick = function(){ C = null; sel = null; rendreCombat(); };
    return;
  }
  el("bTour").onclick = finirTour;
  var ann = el("bAnn"); if (ann) ann.onclick = function(){ sel = null; rendreTerrain(); };
  var def = el("bDef"); if (def) def.onclick = ouvrirDefausse;

  brancher("v-combat", "[data-m]", function(b){
    if (C.occupe) return;
    var idx = parseInt(b.dataset.m, 10);
    var carte = parId[C.main[idx]];
    if (sel && sel.type === "main" && sel.idx === idx) sel = null;
    else sel = {type:"main", idx:idx, zones: carte.pos.filter(function(z){ return placeLibre("joueur", z); })};
    rendreTerrain();
  });
  brancher("v-combat", "[data-slot]", function(s){ toucherSlot(s); });
}

function ouvrirDefausse(){
  var p = [], i;
  p.push('<h3>D\u00e9fausser une carte</h3>');
  p.push('<p class="sous">Une fois par tour, tu peux \u00e9changer une carte de ta main contre 2 \u00e9nergie.</p><div class="liste">');
  for (i = 0; i < C.main.length; i++){
    var c = parId[C.main[i]];
    p.push('<button class="item" data-d="' + i + '"><span class="av">' + visuel(c, 19) + '</span>');
    p.push('<span style="flex:1"><span class="t">' + c.nom + '</span><br>');
    p.push('<span class="d">co\u00fbt ' + c.cout + ' \u26a1</span></span></button>');
  }
  p.push('</div><button class="btn second" id="x">Annuler</button>');

  var f = panneau(p.join(""));
  f.querySelector("#x").onclick = function(){ f.remove(); };
  var noeuds = f.querySelectorAll("[data-d]");
  for (i = 0; i < noeuds.length; i++){
    noeuds[i].onclick = (function(n){
      return function(){
        var idx = parseInt(n.dataset.d, 10);
        log("Tu d\u00e9fausses " + parId[C.main[idx]].nom + " pour 2 \u00e9nergie.");
        C.main.splice(idx, 1);
        C.energie = Math.min(ENERGIE_MAX, C.energie + 2);
        C.defausseFaite = true;
        f.remove(); rendreTerrain();
      };
    })(noeuds[i]);
  }
}

function toucherSlot(node){
  if (C.occupe || C.fini) return;
  var cp = node.dataset.camp, z = node.dataset.z, i = parseInt(node.dataset.i, 10);
  var uid = node.dataset.uid ? parseInt(node.dataset.uid, 10) : null;

  if (sel && sel.type === "main"){
    if (cp !== "joueur" || uid || sel.zones.indexOf(z) === -1) return;
    var id = C.main[sel.idx], c = parId[id];
    C.energie -= c.cout;
    C.main.splice(sel.idx, 1);
    var u = creerUnite(id, "joueur");
    u.zone = z; u.i = i; u.aAgi = true; u.tourPose = C.tour;
    C.joueur.push(u);
    log("Tu poses " + c.nom + " (" + c.cout + " \u00e9nergie). Elle agira au prochain tour.");
    // L'Archimage tire de l'energie de chaque pose a l'arriere.
    if (z === "arriere"){
      var arch = vivants(C.joueur).filter(function(x){ return x.c.id === "archimage" && x.uid !== u.uid; });
      if (arch.length){
        C.energie = Math.min(ENERGIE_MAX, C.energie + 1);
        log("L'Archimage capte l'\u00e9nergie de l'invocation : +1 \u26a1.");
      }
    }
    appliquerEtendard("joueur");
    sel = null;
    rendreTerrain();
    signalerCombos();
    anim(u.uid, "bond");
    return;
  }

  if (sel && sel.type === "attaque"){
    if (!uid || sel.cibles.indexOf(uid) === -1) return;
    var att = C.joueur.filter(function(x){ return x.uid === sel.uid; })[0];
    var a = att.c.attaques[sel.ai];
    sel = null; C.occupe = true;
    executer(att, a, uid).then(function(){
      C.occupe = false;
      if (C.pts >= POINTS_VICTOIRE) terminer(true);
      else rendreTerrain();
    });
    return;
  }

  if (uid && cp === "joueur"){
    var mien = C.joueur.filter(function(x){ return x.uid === uid; })[0];
    if (mien) ouvrirAttaques(mien);
  }
}

function ouvrirAttaques(u){
  var p = [], i;
  p.push('<div class="tete"><div class="av">' + visuel(u.c, 29) + '</div><div>');
  p.push('<h3>' + u.c.nom + '</h3>');
  p.push('<div class="sous">' + u.pv + '/' + u.pvMax + ' PV \u00b7 ' + u.def
    + ' bouclier \u00b7 ' + ZONE_NOM[u.zone] + '</div></div></div>');

  if (u.bonusAtk) p.push('<div class="combo-actif">+' + u.bonusAtk + ' d\u00e9g\u00e2ts accumul\u00e9s</div>');
  if (u.gele) p.push('<div class="astuce" style="border-color:var(--bouclier);color:var(--bouclier);background:#152539">Gel\u00e9e : elle ne peut pas agir ce tour-ci.</div>');
  else if (u.aAgi) p.push('<div class="astuce" style="border-color:var(--bord);background:var(--panneau2);color:var(--texte2)">Cette carte a d\u00e9j\u00e0 agi ce tour-ci.</div>');
  if (u.brule) p.push('<div class="astuce" style="border-color:var(--sang);color:var(--sang);background:#33161A">Br\u00fbl\u00e9e : elle ne peut plus \u00eatre soign\u00e9e.</div>');
  if (!u.c.attaques.length) p.push('<p class="sous" style="margin-top:11px">' + u.c.cap + '</p>');

  for (i = 0; i < u.c.attaques.length; i++){
    var a = u.c.attaques[i];
    var ok = attaqueUtilisable(u, a);
    var raison = "";
    if (!ok){
      if (u.gele) raison = "gel\u00e9e";
      else if (u.aAgi) raison = "a d\u00e9j\u00e0 agi ce tour";
      else if (a.c > C.energie) raison = "\u00e9nergie insuffisante";
      else if (a.portee === "corps" && u.zone !== "avant") raison = "seulement depuis la rang\u00e9e avant";
      else if (a.invoque) raison = "aucun emplacement libre";
      else raison = "aucune cible valide";
    }
    var deg = a.d ? (a.d + " d\u00e9g\u00e2ts \u00b7 ") : "";
    p.push('<button class="atk" data-a="' + i + '"' + (ok ? "" : " disabled") + '>');
    p.push('<div class="l1"><span class="an">' + a.n + '</span><span class="ac">' + a.c + ' \u26a1</span></div>');
    p.push('<div class="ad">' + deg + (a.portee === "corps" ? "contact" : "distance") + ' \u2014 ' + a.txt + '</div>');
    if (raison) p.push('<div class="ad" style="color:var(--sang)">' + raison + '</div>');
    p.push('</button>');
  }
  p.push('<button class="btn second" id="x">Fermer</button>');

  var f = panneau(p.join(""));
  f.querySelector("#x").onclick = function(){ f.remove(); };
  var noeuds = f.querySelectorAll("[data-a]");
  for (i = 0; i < noeuds.length; i++){
    noeuds[i].onclick = (function(n){
      return function(){
        var ai = parseInt(n.dataset.a, 10);
        var a = u.c.attaques[ai];
        f.remove();
        if (a.cible === "soi"){
          C.occupe = true;
          executer(u, a, u.uid).then(function(){ C.occupe = false; rendreTerrain(); });
          return;
        }
        sel = {type:"attaque", uid:u.uid, ai:ai, cibles: ciblesValides(u, a)};
        rendreTerrain();
      };
    })(noeuds[i]);
  }
}

Promise.resolve(charger()).then(function(){
  majRessources();
  rendreCombat();
});

</script>
